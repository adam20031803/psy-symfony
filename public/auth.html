<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>psy — Authentification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ───────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #7c6df8;
      --primary-dark:  #5a4ed1;
      --accent:        #f0a3ff;
      --bg-page:       #0f0e17;
      --glass-bg:      rgba(255,255,255,0.06);
      --glass-border:  rgba(255,255,255,0.12);
      --text:          #e8e8f0;
      --text-muted:    rgba(232,232,240,0.5);
      --error:         #ff6b6b;
      --success:       #6bffb8;
      --input-bg:      rgba(255,255,255,0.07);
      --input-focus:   rgba(124,109,248,0.35);
      --radius:        16px;
      --radius-sm:     10px;
      --transition:    400ms cubic-bezier(0.65, 0, 0.35, 1);
      --shadow:        0 25px 60px rgba(0,0,0,0.45);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-page);
      color: var(--text);
      overflow: hidden;
    }

    /* ─── Background gradient blobs ─────────────────── */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 520px; height: 520px; background: #7c6df8; top: -140px; left: -120px; }
    .blob-2 { width: 420px; height: 420px; background: #f0a3ff; bottom: -100px; right: -80px; }
    .blob-3 { width: 300px; height: 300px; background: #00d4ff; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0.12; }

    /* ─── Page wrapper ───────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* ─── Auth card ──────────────────────────────────── */
    .auth-card {
      position: relative;
      width: 100%;
      max-width: 460px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
      overflow: hidden;
    }

    /* ─── Sliding overlay bar ────────────────────────── */
    .slide-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
      border-radius: 28px;
    }

    .slide-bar {
      position: absolute;
      top: 0; bottom: 0;
      width: 120%;
      left: -120%;
      background: linear-gradient(110deg, #7c6df8 0%, #b09bff 45%, #f0a3ff 80%, #7c6df8 100%);
      transition: left var(--transition);
      will-change: left;
    }

    /* When animating forward */
    .auth-card.sliding-forward .slide-bar {
      left: 120%;
      transition: left var(--transition);
    }

    /* When animating backward */
    .auth-card.sliding-back .slide-bar {
      left: -120%;
      transition: left var(--transition);
    }

    /* ─── Forms container ────────────────────────────── */
    .forms-wrapper {
      position: relative;
      overflow: hidden;
    }

    .form-panel {
      padding: 48px 44px;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .form-panel.hidden {
      display: none;
    }

    /* ─── Logo / header ──────────────────────────────── */
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .auth-logo .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .auth-logo span {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      margin-top: 28px;
    }

    .form-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    /* ─── Input groups ───────────────────────────────── */
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }

    .input-wrap input::placeholder { color: var(--text-muted); }

    .input-wrap input:focus {
      border-color: var(--primary);
      background: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(124,109,248,0.18);
    }

    .input-wrap input:focus + svg,
    .input-wrap:focus-within svg { color: var(--primary); }

    /* fix icon order */
    .input-wrap input { order: 1; }
    .input-wrap { display: flex; flex-direction: column; }
    .input-wrap input { order: 1; }
    .input-wrap > svg { order: 0; position: absolute; }

    /* ─── Options row (remember / forgot) ───────────── */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    .remember input[type="checkbox"] { display: none; }
    .check-box {
      width: 18px; height: 18px;
      border: 1px solid var(--glass-border);
      border-radius: 5px;
      background: var(--input-bg);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .remember input:checked ~ .check-box {
      border-color: var(--primary);
      background: var(--primary);
    }
    .check-box-check { color: white; font-size: 11px; display: none; }
    .remember input:checked ~ .check-box .check-box-check { display: block; }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--accent); }

    /* ─── Primary button ─────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), #9b7cf8);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 8px 24px rgba(124,109,248,0.35);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-primary:hover::after { opacity: 1; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(124,109,248,0.45); }
    .btn-primary:active { transform: translateY(0); }

    /* ─── Divider ────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    /* ─── Switch link row ────────────────────────────── */
    .switch-row {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 28px;
    }

    .switch-row button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .switch-row button:hover { background: rgba(124,109,248,0.15); color: var(--accent); }

    /* ─── Back link ──────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 24px;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    /* ─── Terms text ─────────────────────────────────── */
    .terms-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }
    .terms-text a { color: var(--primary); text-decoration: none; }
    .terms-text a:hover { color: var(--accent); }

    /* ─── Password toggle ─────────────────────────────── */
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--text); }

    /* ─── Strength bar ───────────────────────────────── */
    .strength-bar-wrap {
      margin-top: 8px;
      display: flex;
      gap: 4px;
    }
    .strength-seg {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: rgba(255,255,255,0.1);
      transition: background 0.3s;
    }
    .strength-seg.active-weak   { background: #ff6b6b; }
    .strength-seg.active-medium { background: #ffc96b; }
    .strength-seg.active-strong { background: #6bffb8; }

    /* ─── Responsive ─────────────────────────────────── */
    @media (max-width: 520px) {
      .auth-card { border-radius: 0; min-height: 100vh; }
      .form-panel { padding: 40px 28px; }
      .input-row { grid-template-columns: 1fr; }
    }

    /* ─── Accessibility: focus ring ──────────────────── */
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  </style>
</head>
<body>

<!-- Background blobs -->
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<div class="page">
  <div class="auth-card" id="authCard">

    <!-- Sliding overlay bar -->
    <div class="slide-overlay" id="slideOverlay">
      <div class="slide-bar" id="slideBar"></div>
    </div>

    <div class="forms-wrapper">

      <!-- ══════════════ LOGIN FORM ══════════════ -->
      <div class="form-panel" id="loginPanel">
        <div class="auth-logo">
          <div class="logo-icon">🧠</div>
          <span>psy</span>
        </div>

        <h1 class="form-title">Bienvenue !</h1>
        <p class="form-subtitle">Connectez-vous à votre espace bien-être</p>

        <form id="loginForm" novalidate>
          <div class="input-group">
            <label for="loginEmail">Adresse e-mail</label>
            <div class="input-wrap">
              <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3"/><polyline points="2,4 12,13 22,4"/>
              </svg>
            </div>
          </div>

          <div class="input-group">
            <label for="loginPassword">Mot de passe</label>
            <div class="input-wrap">
              <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <button type="button" class="pw-toggle" onclick="togglePassword('loginPassword', this)" aria-label="Voir le mot de passe">
                <svg id="loginEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" id="rememberMe" />
              <div class="check-box"><span class="check-box-check">✓</span></div>
              Se souvenir de moi
            </label>
            <a href="#" class="forgot-link">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="btn-primary">Se connecter →</button>
        </form>

        <div class="switch-row">
          Pas encore de compte ?
          <button id="goSignup" onclick="switchToSignup()">Créer un compte</button>
        </div>
      </div>

      <!-- ══════════════ SIGNUP FORM ══════════════ -->
      <div class="form-panel hidden" id="signupPanel">
        <button class="back-btn" onclick="switchToLogin()" aria-label="Retour à la connexion">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
          Retour à la connexion
        </button>

        <div class="auth-logo">
          <div class="logo-icon">🧠</div>
          <span>psy</span>
        </div>

        <h1 class="form-title">Créer un compte</h1>
        <p class="form-subtitle">Rejoignez des milliers d'utilisateurs actifs</p>

        <form id="signupForm" novalidate>
          <div class="input-row">
            <div class="input-group">
              <label for="signupNom">Nom</label>
              <div class="input-wrap">
                <input type="text" id="signupNom" placeholder="Dupont" autocomplete="family-name" required />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
            </div>
            <div class="input-group">
              <label for="signupPrenom">Prénom</label>
              <div class="input-wrap">
                <input type="text" id="signupPrenom" placeholder="Jean" autocomplete="given-name" required />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="input-group">
            <label for="signupEmail">Adresse e-mail</label>
            <div class="input-wrap">
              <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3"/><polyline points="2,4 12,13 22,4"/>
              </svg>
            </div>
          </div>

          <div class="input-group">
            <label for="signupPassword">Mot de passe</label>
            <div class="input-wrap">
              <input type="password" id="signupPassword" placeholder="Minimum 8 caractères" autocomplete="new-password" required oninput="checkStrength(this.value)" />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <button type="button" class="pw-toggle" onclick="togglePassword('signupPassword', this)" aria-label="Voir le mot de passe">
                <svg id="signupEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="strength-bar-wrap">
              <div class="strength-seg" id="seg1"></div>
              <div class="strength-seg" id="seg2"></div>
              <div class="strength-seg" id="seg3"></div>
              <div class="strength-seg" id="seg4"></div>
            </div>
          </div>

          <div class="input-group">
            <label for="signupRole">Je suis</label>
            <div class="input-wrap">
              <input type="text" id="signupRole" placeholder="Utilisateur / Coach" value="Utilisateur" readonly
                style="cursor:pointer;"
                onclick="cycleRole(this)" />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
          </div>

          <button type="submit" class="btn-primary">Créer mon compte ✨</button>
        </form>

        <p class="terms-text">
          En créant un compte, vous acceptez nos
          <a href="#">Conditions d'utilisation</a> et notre
          <a href="#">Politique de confidentialité</a>.
        </p>
      </div>

    </div><!-- /forms-wrapper -->
  </div><!-- /auth-card -->
</div><!-- /page -->

<script>
  /* ─── State ─────────────────────────────────────────── */
  const card      = document.getElementById('authCard');
  const bar       = document.getElementById('slideBar');
  const loginP    = document.getElementById('loginPanel');
  const signupP   = document.getElementById('signupPanel');
  let   animating = false;

  /* ─── Core animation engine ─────────────────────────── */
  function slide(direction, onMidpoint) {
    if (animating) return;
    animating = true;

    const HALF = 220; // ms — midpoint where we swap forms
    const FULL = 440; // ms — total duration matches CSS var (400ms + buffer)

    // Step 1: shoot bar across from left edge
    bar.style.transition = 'none';
    bar.style.left = '-120%';
    bar.getBoundingClientRect(); // force reflow
    bar.style.transition = `left ${FULL}ms cubic-bezier(0.65, 0, 0.35, 1)`;
    bar.style.left = '120%';

    // Step 2: at midpoint, swap panels
    setTimeout(() => {
      onMidpoint();
    }, HALF);

    // Step 3: reset bar silently
    setTimeout(() => {
      bar.style.transition = 'none';
      bar.style.left = '-120%';
      animating = false;
    }, FULL + 60);
  }

  /* ─── Login → Signup ────────────────────────────────── */
  function switchToSignup() {
    slide('forward', () => {
      loginP.classList.add('hidden');
      signupP.classList.remove('hidden');
    });
  }

  /* ─── Signup → Login ────────────────────────────────── */
  function switchToLogin() {
    // Reverse: bar comes from right
    if (animating) return;
    animating = true;

    const HALF = 220;
    const FULL = 440;

    bar.style.transition = 'none';
    bar.style.left = '120%';
    bar.getBoundingClientRect();
    bar.style.transition = `left ${FULL}ms cubic-bezier(0.65, 0, 0.35, 1)`;
    bar.style.left = '-120%';

    setTimeout(() => {
      signupP.classList.add('hidden');
      loginP.classList.remove('hidden');
    }, HALF);

    setTimeout(() => {
      bar.style.transition = 'none';
      bar.style.left = '-120%';
      animating = false;
    }, FULL + 60);
  }

  /* ─── Password toggle ───────────────────────────────── */
  const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeOff  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  function togglePassword(id, btn) {
    const input = document.getElementById(id);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = isHidden ? eyeOff : eyeOpen;
  }

  /* ─── Password strength ─────────────────────────────── */
  function checkStrength(val) {
    const segs = [1,2,3,4].map(i => document.getElementById('seg'+i));
    segs.forEach(s => { s.className = 'strength-seg'; }); // reset

    const score =
      (val.length >= 8       ? 1 : 0) +
      (/[A-Z]/.test(val)     ? 1 : 0) +
      (/[0-9]/.test(val)     ? 1 : 0) +
      (/[^A-Za-z0-9]/.test(val) ? 1 : 0);

    const cls = score <= 1 ? 'active-weak' : score <= 2 ? 'active-medium' : 'active-strong';
    for (let i = 0; i < score; i++) segs[i].classList.add(cls);
  }

  /* ─── Role toggle ───────────────────────────────────── */
  const roles = ['Utilisateur', 'Coach', 'Admin'];
  let roleIdx = 0;
  function cycleRole(input) {
    roleIdx = (roleIdx + 1) % roles.length;
    input.value = roles[roleIdx];
  }

  /* ─── Form submissions (demo) ───────────────────────── */
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn-primary');
    btn.textContent = '✓ Connexion réussie !';
    btn.style.background = 'linear-gradient(135deg,#6bffb8,#00d4a0)';
    setTimeout(() => {
      btn.textContent = 'Se connecter →';
      btn.style.background = '';
    }, 2000);
  });

  document.getElementById('signupForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn-primary');
    btn.textContent = '✓ Compte créé !';
    btn.style.background = 'linear-gradient(135deg,#6bffb8,#00d4a0)';
    setTimeout(() => {
      btn.textContent = 'Créer mon compte ✨';
      btn.style.background = '';
    }, 2000);
  });
</script>
